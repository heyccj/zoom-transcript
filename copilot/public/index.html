<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZT Copilot</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121820;
    --panel-2: #0f141b;
    --border: rgba(255,255,255,0.08);
    --text: #e8edf2;
    --text-dim: #8b96a3;
    --text-faint: #566270;
    --accent: #7dd3fc;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --violet: #c4b5fd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    font-size: 15px;
  }

  /* ── Stale banner ── */
  #stale-banner {
    display: none;
    background: var(--red);
    color: #fff;
    font-weight: 700;
    text-align: center;
    padding: 10px;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  body.stale #stale-banner { display: block; animation: flash 1.2s ease-in-out infinite; }
  @keyframes flash { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: 0.02em; }
  header h1 span { color: var(--accent); }
  #session-label { color: var(--text-dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }
  .status-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    white-space: nowrap;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
  body.live .status-dot { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,0.7); }
  body.stale .status-dot { background: var(--red); animation: flash 1s infinite; }
  .hdr-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .hdr-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
  .hdr-btn.on { color: var(--green); border-color: rgba(34,197,94,0.4); }

  /* ── Pulse strip ── */
  #pulse-strip {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    flex-shrink: 0;
  }
  #pulse-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #ai-spinner { display: none; color: var(--accent); font-weight: 400; text-transform: none; letter-spacing: 0; }
  body.thinking #ai-spinner { display: inline; }
  #pulse-text {
    font-size: 22px;
    font-weight: 650;
    margin-top: 6px;
    line-height: 1.3;
    color: var(--text);
  }
  #pulse-text.updated { animation: pulsepop 0.6s ease-out; }
  @keyframes pulsepop { 0% { color: var(--accent); } 100% { color: var(--text); } }
  #pulse-meta { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  /* ── Main scroll area ── */
  main { flex: 1; overflow-y: auto; padding: 14px 18px 120px; }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

  /* ── Brief ── */
  details#brief-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
  }
  details#brief-box summary {
    cursor: pointer;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    user-select: none;
  }
  details#brief-box[open] summary { border-bottom: 1px solid var(--border); }
  #brief-body { padding: 12px 14px; }
  #brief-input {
    width: 100%;
    min-height: 110px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    padding: 10px;
    resize: vertical;
  }
  #brief-input:focus { outline: none; border-color: rgba(125,211,252,0.4); }
  #brief-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  #brief-save {
    background: rgba(125,211,252,0.12);
    border: 1px solid rgba(125,211,252,0.35);
    color: var(--accent);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  #brief-save:hover { background: rgba(125,211,252,0.2); }
  #brief-status { font-size: 12px; color: var(--text-faint); }

  /* ── Suggestion cards ── */
  #cards { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--text-faint);
    border-radius: 10px;
    padding: 12px 14px;
    position: relative;
    animation: slidein 0.25s ease-out;
  }
  @keyframes slidein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .card--info { border-left-color: var(--accent); }
  .card--act-now {
    border-left-color: var(--amber);
    border-color: rgba(245,158,11,0.4);
    background: rgba(245,158,11,0.07);
  }
  .card--answer { border-left-color: var(--violet); }
  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .card--act-now .card-tag { color: var(--amber); }
  .card--info .card-tag { color: var(--accent); }
  .card--answer .card-tag { color: var(--violet); }
  .card-time { font-weight: 400; letter-spacing: 0; }
  .card-dismiss {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    line-height: 1;
  }
  .card-dismiss:hover { color: var(--text); }
  .card-q { font-size: 12px; color: var(--text-dim); font-style: italic; margin-bottom: 4px; }
  .card-body { font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .card--act-now .card-body { font-size: 17px; font-weight: 600; }
  #empty-note { color: var(--text-faint); font-size: 13px; font-style: italic; padding: 10px 2px; }

  /* ── Ask bar ── */
  #ask-bar {
    position: fixed;
    left: 0; right: 0;
    bottom: 42px;
    display: flex;
    gap: 8px;
    padding: 10px 18px;
    background: linear-gradient(transparent, var(--bg) 30%);
  }
  #ask-input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
  }
  #ask-input:focus { outline: none; border-color: rgba(125,211,252,0.4); }
  #ask-btn, #nudge-btn {
    background: rgba(125,211,252,0.12);
    border: 1px solid rgba(125,211,252,0.35);
    color: var(--accent);
    border-radius: 8px;
    padding: 0 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  #ask-btn:hover, #nudge-btn:hover { background: rgba(125,211,252,0.22); }
  #nudge-btn { color: var(--amber); border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.08); }
  #nudge-btn:hover { background: rgba(245,158,11,0.16); }

  /* ── Transcript drawer ── */
  #drawer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--panel-2);
    border-top: 1px solid var(--border);
  }
  #drawer-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-dim);
    user-select: none;
  }
  #drawer-bar:hover { background: rgba(255,255,255,0.03); }
  #drawer-latest {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-style: italic;
    color: var(--text-faint);
  }
  #drawer-count { color: var(--text-faint); white-space: nowrap; }
  #drawer-arrow { color: var(--text-faint); }
  #drawer-body {
    display: none;
    max-height: 40vh;
    overflow-y: auto;
    padding: 6px 18px 12px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.5;
  }
  body.drawer-open #drawer-body { display: block; }
  body.drawer-open #ask-bar { display: none; }
  #drawer-body::-webkit-scrollbar { width: 5px; }
  #drawer-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  .tl { padding: 1px 0; color: var(--text-dim); }
  .tl b { color: var(--text); font-weight: 600; }
  .tl .tl-time { color: var(--text-faint); font-size: 11px; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .tl--pending { font-style: italic; color: var(--text-faint); }
  .tl--marker { font-style: italic; color: var(--text-faint); }
  .tl--chat b::after { content: ' · chat'; font-weight: 400; color: var(--text-faint); font-size: 11px; }
</style>
</head>
<body>

<div id="stale-banner">⚠ TRANSCRIPT FEED LOST — check the Zoom tab / bookmarklet</div>

<header>
  <h1>ZT <span>Copilot</span></h1>
  <div id="session-label"></div>
  <div class="spacer"></div>
  <div class="status-chip"><div class="status-dot"></div><span id="status-text">waiting for Zoom…</span></div>
  <button id="notif-btn" class="hdr-btn" type="button">🔔 Notifications</button>
  <button id="chime-btn" class="hdr-btn" type="button">♪ Chime</button>
</header>

<div id="pulse-strip">
  <div id="pulse-label">Meeting pulse <span id="ai-spinner">· thinking…</span></div>
  <div id="pulse-text">—</div>
  <div id="pulse-meta"></div>
</div>

<main>
  <details id="brief-box" open>
    <summary>Meeting brief — notes, objectives, desired outcomes</summary>
    <div id="brief-body">
      <textarea id="brief-input" placeholder="Paste your objectives, talking points, desired outcomes, things to watch for…&#10;&#10;The AI reads this before every suggestion."></textarea>
      <div id="brief-actions">
        <button id="brief-save" type="button">Save brief</button>
        <span id="brief-status"></span>
      </div>
    </div>
  </details>

  <div id="cards">
    <div id="empty-note">Suggestions will appear here once the meeting transcript starts flowing.</div>
  </div>
</main>

<div id="ask-bar">
  <input id="ask-input" placeholder="Ask the transcript anything… (e.g. catch me up, what did she say about the budget?)" spellcheck="false">
  <button id="ask-btn" type="button">Ask</button>
  <button id="nudge-btn" type="button" title="Force an immediate suggestion cycle">⚡ Nudge now</button>
</div>

<div id="drawer">
  <div id="drawer-bar">
    <span id="drawer-arrow">▴</span>
    <span style="font-weight:600">Transcript</span>
    <span id="drawer-latest">nothing yet</span>
    <span id="drawer-count"></span>
  </div>
  <div id="drawer-body"></div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var entriesCount = 0;
  var briefAutoCollapsed = false;
  var aiEnabled = false;
  var lastPulseAt = null;

  // ── Prefs ──
  var chimeOn = localStorage.getItem('ztc-chime') !== '0';
  function syncChimeBtn() {
    $('chime-btn').classList.toggle('on', chimeOn);
    $('chime-btn').textContent = chimeOn ? '♪ Chime on' : '♪ Chime off';
  }
  $('chime-btn').onclick = function () {
    chimeOn = !chimeOn;
    localStorage.setItem('ztc-chime', chimeOn ? '1' : '0');
    syncChimeBtn();
    if (chimeOn) chime();
  };
  syncChimeBtn();

  function syncNotifBtn() {
    var p = ('Notification' in window) ? Notification.permission : 'unsupported';
    $('notif-btn').classList.toggle('on', p === 'granted');
    $('notif-btn').textContent = p === 'granted' ? '🔔 Notifications on'
      : p === 'denied' ? '🔕 Notifications blocked' : '🔔 Enable notifications';
  }
  $('notif-btn').onclick = function () {
    if (!('Notification' in window)) return;
    Notification.requestPermission().then(syncNotifBtn);
  };
  syncNotifBtn();

  function notify(title, body) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      new Notification(title, { body: body, tag: 'zt-copilot', renotify: true });
    } catch (e) { /* ignore */ }
  }

  function chime() {
    if (!chimeOn) return;
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(880, ctx.currentTime);
      o.frequency.setValueAtTime(1175, ctx.currentTime + 0.12);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      o.start();
      o.stop(ctx.currentTime + 0.55);
      setTimeout(function () { ctx.close(); }, 700);
    } catch (e) { /* ignore */ }
  }

  function fmtTime(ms) {
    if (!ms) return '';
    var d = new Date(ms);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getHours() + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function esc(s) {
    var div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML;
  }

  // ── Status ──
  function setFeed(feed) {
    document.body.classList.toggle('live', feed === 'live');
    document.body.classList.toggle('stale', feed === 'stale');
    $('status-text').textContent =
      feed === 'live' ? 'live' :
      feed === 'stale' ? 'FEED LOST' : 'waiting for Zoom…';
  }

  // ── Pulse ──
  function setPulse(text, at) {
    lastPulseAt = at || Date.now();
    var el = $('pulse-text');
    el.textContent = text;
    el.classList.remove('updated');
    void el.offsetWidth; // restart animation
    el.classList.add('updated');
  }
  setInterval(function () {
    if (!lastPulseAt) return;
    var s = Math.round((Date.now() - lastPulseAt) / 1000);
    $('pulse-meta').textContent = s < 5 ? 'just now' : s + 's ago';
  }, 1000);

  // ── Cards ──
  function removeEmptyNote() {
    var n = $('empty-note');
    if (n) n.remove();
  }

  function makeCard(opts) {
    removeEmptyNote();
    var card = document.createElement('div');
    card.className = 'card card--' + opts.kind;
    card.innerHTML =
      '<div class="card-head">' +
        '<span class="card-tag">' + esc(opts.tag) + '</span>' +
        '<span class="card-time">' + fmtTime(opts.at || Date.now()) + '</span>' +
        '<button class="card-dismiss" title="Dismiss">✕</button>' +
      '</div>' +
      (opts.question ? '<div class="card-q">“' + esc(opts.question) + '”</div>' : '') +
      '<div class="card-body"></div>';
    card.querySelector('.card-dismiss').onclick = function () { card.remove(); };
    card.querySelector('.card-body').textContent = opts.text || '';
    $('cards').prepend(card);
    return card;
  }

  var liveCards = {}; // id → card element (streaming)

  function suggestionTag(urgency) {
    return urgency === 'act-now' ? '⚡ Act now' : 'Suggestion';
  }

  // ── Transcript drawer ──
  var settledEl = document.createElement('div');
  var pendingEl = document.createElement('div');
  $('drawer-body').appendChild(settledEl);
  $('drawer-body').appendChild(pendingEl);

  $('drawer-bar').onclick = function () {
    document.body.classList.toggle('drawer-open');
    $('drawer-arrow').textContent = document.body.classList.contains('drawer-open') ? '▾' : '▴';
    if (document.body.classList.contains('drawer-open')) {
      $('drawer-body').scrollTop = $('drawer-body').scrollHeight;
    }
  };

  function lineHtml(e, pending) {
    var cls = 'tl' + (pending ? ' tl--pending' : '') + (e.marker ? ' tl--marker' : '') + (e.chat ? ' tl--chat' : '');
    var who = e.marker ? '' : '<b>' + esc(e.name || '(unknown)') + '</b>: ';
    return '<div class="' + cls + '"><span class="tl-time">' + esc(e.time || '') + '</span>' + who + esc(e.msg) + '</div>';
  }

  function addEntries(entries) {
    var atBottom = $('drawer-body').scrollTop + $('drawer-body').clientHeight >= $('drawer-body').scrollHeight - 30;
    entries.forEach(function (e) {
      settledEl.insertAdjacentHTML('beforeend', lineHtml(e, false));
      entriesCount++;
      var label = (e.name ? e.name + ': ' : '') + e.msg;
      $('drawer-latest').textContent = label;
    });
    $('drawer-count').textContent = entriesCount + ' lines';
    if (atBottom) $('drawer-body').scrollTop = $('drawer-body').scrollHeight;
    maybeCollapseBrief();
  }

  function setPending(pending) {
    pendingEl.innerHTML = pending.map(function (l) { return lineHtml(l, true); }).join('');
    if (pending.length) {
      var last = pending[pending.length - 1];
      $('drawer-latest').textContent = (last.name ? last.name + ': ' : '') + last.msg;
    }
    maybeCollapseBrief();
  }

  function maybeCollapseBrief() {
    if (briefAutoCollapsed) return;
    briefAutoCollapsed = true;
    $('brief-box').open = false;
  }

  // ── Brief ──
  $('brief-save').onclick = function () {
    fetch('/brief', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: $('brief-input').value })
    }).then(function () {
      $('brief-status').textContent = 'Saved ' + fmtTime(Date.now());
    }).catch(function () {
      $('brief-status').textContent = 'Save failed — is the server running?';
    });
  };

  // ── Ask / nudge ──
  function ask() {
    var q = $('ask-input').value.trim();
    if (!q) return;
    if (!aiEnabled) { alert('No API key configured — add apiKey to copilot/config.json and restart.'); return; }
    $('ask-input').value = '';
    fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
  }
  $('ask-btn').onclick = ask;
  $('ask-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') ask();
  });
  $('nudge-btn').onclick = function () {
    if (!aiEnabled) { alert('No API key configured — add apiKey to copilot/config.json and restart.'); return; }
    fetch('/ask', { method: 'POST' });
  };

  // ── SSE ──
  var es = new EventSource('/events');

  es.onmessage = function (ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }

    switch (msg.type) {
      case 'init':
        aiEnabled = msg.aiEnabled;
        if (msg.brief && !$('brief-input').value) $('brief-input').value = msg.brief;
        if (msg.session) $('session-label').textContent = msg.session;
        settledEl.innerHTML = '';
        entriesCount = msg.totalEntries - msg.entries.length;
        addEntries(msg.entries);
        if (!msg.entries.length) briefAutoCollapsed = false, $('brief-box').open = true;
        setPending(msg.pending || []);
        (msg.suggestions || []).forEach(function (s) {
          makeCard({ kind: s.urgency === 'act-now' ? 'act-now' : 'info', tag: suggestionTag(s.urgency), text: s.text, at: s.at });
        });
        if (msg.pulse) setPulse(msg.pulse.text, msg.pulse.at);
        setFeed(msg.feed);
        if (!aiEnabled) setPulse('AI disabled — no API key in copilot/config.json', Date.now());
        break;

      case 'reset':
        settledEl.innerHTML = '';
        pendingEl.innerHTML = '';
        entriesCount = 0;
        $('cards').innerHTML = '';
        liveCards = {};
        if (msg.session) $('session-label').textContent = msg.session;
        break;

      case 'session':
        $('session-label').textContent = msg.session || '';
        break;

      case 'entries': addEntries(msg.entries); break;
      case 'pending': setPending(msg.pending); break;

      case 'status': setFeed(msg.feed); break;

      case 'brief':
        if (document.activeElement !== $('brief-input')) $('brief-input').value = msg.brief;
        break;

      case 'ai-thinking':
        document.body.classList.add('thinking');
        break;

      case 'pulse':
        setPulse(msg.text, msg.at);
        break;

      case 'suggestion-start':
        var kind = msg.urgency === 'act-now' ? 'act-now' : 'info';
        liveCards['s' + msg.id] = makeCard({ kind: kind, tag: suggestionTag(msg.urgency), text: '' });
        break;

      case 'suggestion-delta':
        var sc = liveCards['s' + msg.id];
        if (sc) sc.querySelector('.card-body').textContent += msg.text;
        break;

      case 'suggestion-done':
        document.body.classList.remove('thinking');
        var done = liveCards['s' + msg.id];
        if (done) {
          done.querySelector('.card-body').textContent = msg.text;
          delete liveCards['s' + msg.id];
        } else {
          makeCard({ kind: msg.urgency === 'act-now' ? 'act-now' : 'info', tag: suggestionTag(msg.urgency), text: msg.text, at: msg.at });
        }
        if (msg.urgency === 'act-now') {
          notify('ZT Copilot — act now', msg.text);
          chime();
        }
        break;

      case 'suggestion-none':
        document.body.classList.remove('thinking');
        break;

      case 'ai-error':
        document.body.classList.remove('thinking');
        setPulse('AI error — ' + msg.message.slice(0, 80), Date.now());
        break;

      case 'answer-start':
        liveCards[msg.id] = makeCard({ kind: 'answer', tag: 'Answer', question: msg.question, text: '' });
        break;

      case 'answer-delta':
        var ac = liveCards[msg.id];
        if (ac) ac.querySelector('.card-body').textContent += msg.text;
        break;

      case 'answer-done':
        var adone = liveCards[msg.id];
        if (adone) {
          adone.querySelector('.card-body').textContent = msg.text;
          delete liveCards[msg.id];
        }
        break;
    }
  };

  es.onerror = function () {
    $('status-text').textContent = 'server disconnected';
    document.body.classList.remove('live');
  };
})();
</script>
</body>
</html>
